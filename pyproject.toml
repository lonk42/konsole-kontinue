[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "konsole-kontinue"
version = "0.1.0"
description = "Save and restore Konsole tabs, splits and layouts"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "OnTheLink" }]
keywords = ["konsole", "kde", "dbus", "session-restore", "wayland", "terminal"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: KDE",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Desktop Environment :: K Desktop Environment (KDE)",
]
# dbus-python is packaged as python3-dbus (Fedora), python3-dbus (Debian) and
# python-dbus (Arch). PyGObject, which watch needs for the GLib main loop, is
# python3-gobject (Fedora), python3-gi (Debian) and python-gobject (Arch).
# Prefer the distro packages; the dependencies are declared so pip installs work
# too, at the cost of needing dbus, glib, girepository and cairo build headers.
dependencies = ["dbus-python>=1.2", "PyGObject>=3.36"]

[project.urls]
Homepage = "https://github.com/lonk42/konsole-kontinue"
Source = "https://github.com/lonk42/konsole-kontinue"
Issues = "https://github.com/lonk42/konsole-kontinue/issues"

[project.scripts]
kontinue = "kontinue.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src"]

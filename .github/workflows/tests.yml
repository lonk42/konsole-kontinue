name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Neither dbus-python nor PyGObject ships wheels, and PyGObject pulls in
      # pycairo, so all three build from source against these headers.
      # PyGObject 3.52 and later want girepository-2.0, which lives in glib
      # 2.80 and later; the 1.0 package is the fallback for older runners.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libdbus-1-dev libglib2.0-dev libffi-dev libcairo2-dev pkg-config
          sudo apt-get install -y libgirepository-2.0-dev \
            || sudo apt-get install -y libgirepository1.0-dev

      - name: Install
        run: pip install -e '.[dev]'

      - name: Run tests
        run: pytest -q
